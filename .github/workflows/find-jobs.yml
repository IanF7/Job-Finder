name: Find jobs

on:
  schedule:
    # 10:23 UTC = 3:23 AM Arizona, well before the 5:55 AM digest
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["companies.json", "finder.py", ".github/workflows/find-jobs.yml"]

permissions:
  contents: write

concurrency:
  group: find-jobs
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run finder
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python finder.py
      - name: Commit results
        run: |
          git config user.name "job-finder-bot"
          git config user.email "job-finder-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Job results $(TZ=America/Phoenix date +%F)"
            # if another run saved results meanwhile, keep this run's (newer) files
            git pull --rebase -X theirs origin main
            git push
          fi
